# genqlient configuration for Pipe2.ai Go SDK
# Docs: https://github.com/Khan/genqlient/blob/main/docs/genqlient.yaml
schema: ../graphql/user-schema.graphql
operations:
  - ../graphql/operations/*.graphql
generated: ./generated.go
package: pipe2

# Hasura custom scalar mappings
bindings:
  # Postgres INET (users.signup_ip / last_ip, migration 73) — genqlient needs an
  # explicit binding for every Hasura scalar or codegen hard-fails.
  inet:
    type: string
  uuid:
    type: string
  timestamp:
    type: string
  timestamptz:
    type: string
  jsonb:
    type: encoding/json.RawMessage
  bigint:
    type: int64
  smallint:
    type: int16
  numeric:
    type: float64

# Use pointer for optional fields
optional: pointer
